<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Витрина Ласточка</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="products-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;">
        <p>Загрузка данных...</p>
    </div>

<script>
    const SUPABASE_URL = "https://eqbzrqpktsdbvhrrjdpy.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_DTbnGjq6tA-vu_t1fmpp0w_2z_WLsxh"; 
    const GITHUB_BASE = "https://raw.githubusercontent.com/Richy5959/lastochka_phono/main";

    async function init() {
        try {
            const grid = document.getElementById('products-grid');
            
            // 1. Грузим карту
            const mapRes = await fetch(GITHUB_BASE + '/map.json');
            const photoMap = await mapRes.json();
            
            // 2. Инициализируем Supabase
            const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            // 3. Получаем товары
            const { data, error } = await client.from('products').select('*');
            
            if (error) throw error;
            
            grid.innerHTML = ''; // Очищаем "Загрузка..."
            
            data.forEach(p => {
                const imgPath = photoMap[p.product_code];
                const src = imgPath ? `${GITHUB_BASE}/${imgPath}` : 'https://placehold.co/200?text=Нет+фото';
                
                grid.insertAdjacentHTML('beforeend', `
                    <div style="border:1px solid #ccc; padding:10px;">
                        <img src="${src}" style="width:100%" onerror="this.src='https://placehold.co/200?text=Ошибка'">
                        <h3>${p.product_code}</h3>
                        <p>${p.price} грн</p>
                    </div>
                `);
            });
            console.log("Успех! Товары отрисованы.");
        } catch (e) {
            console.error("Ошибка в коде:", e);
            document.getElementById('products-grid').innerHTML = "Ошибка: " + e.message;
        }
    }
    
    init();
</script>
</body>
</html>
